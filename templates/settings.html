{% extends "base.html" %}
{% block title %}Ayarlar{% endblock %}
{% block content %}
<div class="card settings-card">
  <div class="card-body p-4">
    <h1 class="h4">Ayarlar</h1>
    <form action="{{ url_for('settings') }}" method="post" class="mt-4">
      <label class="form-label" for="yearly_goal">Yıllık kitap hedefi</label>
      <input class="form-control" id="yearly_goal" name="yearly_goal" type="number" min="1" value="{{ goal }}" required>
      <button class="btn btn-primary mt-3" type="submit">Kaydet</button>
    </form>
  </div>
</div>
{% endblock %}
