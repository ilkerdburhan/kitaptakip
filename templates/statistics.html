{% extends "base.html" %}
{% block title %}İstatistik{% endblock %}
{% block content %}
<h1 class="h4 mb-4">İstatistik</h1>
<div class="row g-3 mb-4">
  <div class="col-md-4"><div class="card stat-card"><div class="card-body"><span class="text-secondary">Yıllık hedef</span><div class="stat-number">{{ completed }}/{{ goal }}</div><p class="mb-0">{{ status_text }}</p></div></div></div>
  <div class="col-md-4"><div class="card stat-card"><div class="card-body"><span class="text-secondary">Okuma serisi</span><div class="stat-number">{{ streak }} gün</div></div></div></div>
</div>
<div class="card"><div class="card-body">
  <h2 class="h6">Aylık Okunan Sayfa</h2>
  <canvas id="monthlyChart" height="120"></canvas>
</div></div>
{% endblock %}
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
new Chart(document.getElementById('monthlyChart'), {
  type: 'bar',
  data: {
    labels: ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'],
    datasets: [{label: 'Okunan sayfa', data: {{ monthly|tojson }}, backgroundColor: '#EC691F'}]
  },
  options: {responsive:true, scales:{y:{beginAtZero:true}}}
});
</script>
{% endblock %}
